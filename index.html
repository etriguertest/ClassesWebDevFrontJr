<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora</title>
  
  <!-- CSS Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- CSS Personalizado -->
  <link rel="stylesheet" href="css/style.css">
  
  <!-- 'defer' garantiza que el JS se ejecute cuando el HTML ya esté listo -->
  <script src="js/script.js" defer></script>
</head>
<body>

  <div class="calculator shadow-lg">
    <!-- Pantalla -->
    <input type="text" id="pantalla" class="form-control screen" value="0" readonly>

    <!-- Contenedor de Botones -->
    <div class="buttons-grid" id="contenedor-botones">
      <button class="btn btn-danger col-2-span" data-action="clear">C</button>
      <button class="btn btn-secondary" data-action="delete">DEL</button>
      <button class="btn btn-warning fw-bold" data-val="/">÷</button>

      <button class="btn btn-light" data-val="7">7</button>
      <button class="btn btn-light" data-val="8">8</button>
      <button class="btn btn-light" data-val="9">9</button>
      <button class="btn btn-warning fw-bold" data-val="*">×</button>

      <button class="btn btn-light" data-val="4">4</button>
      <button class="btn btn-light" data-val="5">5</button>
      <button class="btn btn-light" data-val="6">6</button>
      <button class="btn btn-warning fw-bold" data-val="-">-</button>

      <button class="btn btn-light" data-val="1">1</button>
      <button class="btn btn-light" data-val="2">2</button>
      <button class="btn btn-light" data-val="3">3</button>
      <button class="btn btn-warning fw-bold" data-val="+">+</button>

      <button class="btn btn-light col-2-span" data-val="0">0</button>
      <button class="btn btn-light" data-val=".">.</button>
      <button class="btn btn-primary fw-bold" data-action="equal">=</button>
    </div>
  </div>

</body>
</html>
