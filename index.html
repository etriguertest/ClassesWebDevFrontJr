<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rick &amp; Morty Portal Finder</title>

  <!-- Preconectar con el dominio de la API para reducir latencia de imágenes -->
  <link rel="preconnect" href="https://rickandmortyapi.com">
  
  <!-- Bootstrap 5.3 CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  
  <!-- Estilos personalizados separados -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-dark text-light min-vh-100 py-4">

  <main class="container">
    <!-- Encabezado -->
    <header class="text-center mb-4">
      <h1 class="display-5 fw-bold text-success portal-title">🛸 Rick &amp; Morty Portal Finder</h1>
      <p class="text-secondary">
        Módulos ES6, métodos de arreglos y asincronía con fetch
      </p>
    </header>

    <!-- Controles de filtrado -->
    <section class="card bg-secondary bg-opacity-10 border-secondary mb-3 p-3">
      <div class="row g-2 align-items-center">
        <div class="col-12 col-md-5">
          <input type="text" id="input-busqueda" class="form-control" placeholder="Buscar por nombre (ej: Rick, Morty)...">
        </div>
        <div class="col-6 col-md-4">
          <select id="select-estado" class="form-select">
            <option value="todos">Todos los estados</option>
            <option value="Alive">Vivos (Alive)</option>
            <option value="Dead">Muertos (Dead)</option>
            <option value="unknown">Desconocidos (unknown)</option>
          </select>
        </div>
        <div class="col-6 col-md-3 d-grid">
          <button id="btn-cargar" class="btn btn-success fw-bold">
            ↻ Recargar datos
          </button>
        </div>
      </div>
    </section>

    <!-- Paginación y contador -->
    <section class="d-flex flex-wrap justify-content-between align-items-center bg-dark border border-secondary rounded p-2 mb-3 gap-2">
      <div class="d-flex align-items-center gap-2">
        <button id="btn-anterior" class="btn btn-outline-secondary btn-sm" disabled>← Anterior</button>
        <span id="indicador-pagina" class="small text-secondary fw-bold">Página 1 de 1</span>
        <button id="btn-siguiente" class="btn btn-outline-secondary btn-sm" disabled>Siguiente →</button>
      </div>
      <div class="d-flex align-items-center gap-3">
        <span id="resumen" class="small text-info"></span>
        <span id="contador-favoritos" class="badge bg-warning text-dark fs-6">⭐ Favoritos: 0</span>
      </div>
    </section>

    <!-- Estado 1: Cargando -->
    <div id="loading" class="text-center py-5 d-none">
      <div class="spinner-border text-success spinner-portal" role="status" style="width: 3rem; height: 3rem;">
        <span class="visually-hidden">Cargando...</span>
      </div>
      <p class="mt-2 text-secondary">Sintonizando la frecuencia de la Ciudadela...</p>
    </div>

    <!-- Estado 2: Error -->
    <div id="alerta-error" class="alert alert-danger d-flex justify-content-between align-items-center d-none" role="alert">
      <div>
        <span class="fw-bold">⚠️ Error:</span> <span id="error-mensaje"></span>
      </div>
      <button id="btn-reintentar" class="btn btn-danger btn-sm fw-bold">Reintentar</button>
    </div>

    <!-- Estado 3: Éxito (Tarjetas) -->
    <section id="contenedor-tarjetas" class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-3">
    </section>
  </main>

  <!-- Modal Ficha Técnica -->
  <div class="modal fade" id="modal-detalle" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content bg-dark text-light border-secondary">
        <div class="modal-header border-secondary">
          <h5 class="modal-title text-success fw-bold" id="modal-nombre">Detalle del Personaje</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body text-center" id="modal-cuerpo">
          <!-- Inyectado dinámicamente -->
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
