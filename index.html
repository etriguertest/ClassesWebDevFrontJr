<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rick &amp; Morty Portal Finder</title> <!-- Bootstrap 5.3 CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>

<body class="bg-dark text-light min-vh-100 py-4">
    <main class="container">
        <header class="text-center mb-4">
            <h1 class="display-5 fw-bold text-success">🛸 Rick &amp; Morty Portal Finder</h1>
            <p class="text-secondary"> Módulos, métodos de arreglos y asincronía con fetch </p>
        </header> <!-- Controles -->
        <section class="card bg-secondary bg-opacity-10 border-secondary mb-4 p-3">
            <div class="row g-2 align-items-center">
                <div class="col-12 col-md-5"> <input type="text" id="input-busqueda" class="form-control"
                        placeholder="Buscar por nombre (ej: Rick, Morty)..."> </div>
                <div class="col-6 col-md-4"> <select id="select-estado" class="form-select">
                        <option value="todos">Todos los estados</option>
                        <option value="Alive">Vivos (Alive)</option>
                        <option value="Dead">Muertos (Dead)</option>
                        <option value="unknown">Desconocidos (unknown)</option>
                    </select> </div>
                <div class="col-6 col-md-3 d-grid"> <button id="btn-cargar" class="btn btn-success fw-bold"> ↻ Recargar
                        datos </button> </div>
            </div>
        </section> <!-- Zona de pruebas: datos sin formato (Bloque E) -->
        <div id="salida-simple" class="mb-4 text-info"></div> <!-- Estado 1: cargando -->
        <div id="loading" class="text-center py-5 d-none">
            <div class="spinner-border text-success" role="status" style="width: 3rem; height: 3rem;"> <span
                    class="visually-hidden">Cargando...</span> </div>
            <p class="mt-2 text-secondary">Sintonizando la frecuencia de la Ciudadela...</p>
        </div> <!-- Estado 2: error -->
        <div id="alerta-error" class="alert alert-danger d-none" role="alert"> <span class="fw-bold">⚠ Error:</span>
            <span id="error-mensaje"></span> </div> <!-- Estado 3: éxito (tarjetas) -->
        <section id="contenedor-tarjetas" class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-3">
        </section>
    </main> <!-- type="module" habilita import/export en el navegador -->
    <script type="module" src="js/main.js"></script>
</body>

</html>
