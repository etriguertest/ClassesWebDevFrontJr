<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GhostNet v2 · Operaciones en Campo</title>
  
  <!-- Bootstrap 5.3 CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <!-- Estilos Personalizados -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="py-4">

  <div class="container-fluid px-4" style="max-width: 1350px;">
    
    <!-- Encabezado de la Terminal -->
    <header class="border-bottom border-secondary pb-3 mb-4 d-flex justify-content-between align-items-center">
      <div>
        <h1 class="h4 text-gold mb-1 fw-bold">
          👁 GHOSTNET // OPERACIONES EN CAMPO
        </h1>
        <small class="text-secondary">
          DIVISIÓN DE RECLUTAMIENTO SEGURO E INMUTABILIDAD
        </small>
      </div>
      <div class="text-end">
        <span class="badge badge-veterano mb-1">NIVEL 5</span>
        <div class="small text-terminal-green">
          ● TERMINAL SEGURA
        </div>
      </div>
    </header>

    <!-- Contenedor para Alertas Dinámicas de la Terminal -->
    <div id="alerta-terminal" class="d-none"></div>

    <!-- Contenedor Principal GhostNet (3 Columnas) -->
    <main id="app-root" class="mb-5"></main>

    <!-- Pie de página clasificado -->
    <footer class="text-center text-secondary mt-5">
      GHOSTNET INTEL SYSTEM · SESIÓN CLASIFICADA C08–C09 · OPERACIONES PURAS E INMUTABLES
    </footer>

  </div>

  <script src="js/app.js"></script>
</body>
</html>
